<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
        var require = {
            paths: {
                "vs": "./vendor/monaco-editor-0.44.0/min/vs"
            }
        };
    </script>
    <script src="./vendor/monaco-editor-0.44.0/min/vs/loader.js"></script>
    <script src="./vendor/monaco-editor-0.44.0/min/vs/editor/editor.main.nls.js"></script>
    <script src="./vendor/monaco-editor-0.44.0/min/vs/editor/editor.main.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.css" integrity="sha512-KXol4x3sVoO+8ZsWPFI/r5KBVB/ssCGB5tsv2nVOKwLg33wTFP3fmnXa47FdSVIshVTgsYk/1734xSk9aFIa4A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.5.0/semantic.min.js" integrity="sha512-Xo0Jh8MsOn72LGV8kU5LsclG7SUzJsWGhXbWcYs2MAmChkQzwiW/yTQwdJ8w6UA9C6EVG18GHb/TrYpYCjyAQw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script type="module" src="js/ide.js"></script>

    <link type="text/css" rel="stylesheet" href="css/ide.css">
    <link type="text/css" rel="stylesheet" href="css/semantic.css">
    <link type="text/css" rel="stylesheet" href="css/site.css">

    <title>MyOwnIDE</title>
    <meta name="theme-color" content="#111827">
</head>
<body>
    <div id="topbar">
        <div class="topbar-left">
            <div class="brand">MyOwnIDE</div>
            <select id="select-language" class="ui search selection dropdown"></select>
        </div>

        <div class="topbar-right">
            <button id="appearance-btn" class="ui button">Appearance</button>
            <button id="open-file-btn" class="ui button">Open</button>
            <button id="save-btn" class="ui button">Save</button>
            <button id="run-btn" class="ui primary button">Run Code</button>
        </div>
    </div>

    <div id="app-shell">
        <section class="editor-panel panel">
            <div class="panel-header">
                <div class="panel-title">Editor</div>
                <div id="status-line" class="status-line">Ready</div>
            </div>
            <div id="source-editor" class="editor-host"></div>
        </section>

        <aside class="side-panel">
            <section class="panel io-panel">
                <div class="panel-header">
                    <div class="panel-title">Custom Input</div>
                </div>
                <div id="stdin-editor" class="editor-host side-editor"></div>
            </section>

            <section class="panel io-panel">
                <div class="panel-header">
                    <div class="panel-title">Output</div>
                    <button id="review-code-btn" class="ui button mini" hidden disabled>Review Code</button>
                </div>
                <div id="stdout-editor" class="editor-host side-editor"></div>
            </section>
        </aside>
    </div>

    <div id="bottom-tools">
        <section class="panel tool-card">
            <div class="panel-header">
                <div class="panel-title">Asymptotic Complexity</div>
                <button id="complexity-btn" class="ui button mini">Analyze</button>
            </div>
            <div class="tool-content">
                <div id="complexity-result" class="complexity-result">Not analyzed yet.</div>
            </div>
        </section>

        <section class="panel tool-card stress-card">
            <div class="panel-header">
                <div class="panel-title">Stress Tests</div>
                <button id="run-stress-btn" class="ui button mini">Run Current Input</button>
            </div>
            <div class="tool-content">
                <div class="stress-controls">
                    <label class="field">
                        <span>Preset</span>
                        <select id="stress-preset-select" class="ui selection dropdown">
                            <option value="random">Random</option>
                            <option value="empty">Empty Array</option>
                            <option value="zeros">All Zeros</option>
                            <option value="negative">All Negative</option>
                            <option value="increasing">Increasing</option>
                            <option value="decreasing">Decreasing</option>
                            <option value="constant">Constant</option>
                            <option value="alternating">Alternating</option>
                            <option value="duplicates">Many Duplicates</option>
                            <option value="single">Single Element</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Array Size</span>
                        <input id="stress-size" type="number" min="0" max="1000" value="5">
                    </label>
                    <label class="field">
                        <span>Min Value</span>
                        <input id="stress-min" type="number" value="-5">
                    </label>
                    <label class="field">
                        <span>Max Value</span>
                        <input id="stress-max" type="number" value="5">
                    </label>
                </div>

                <div class="stress-actions">
                    <button id="generate-stress-btn" class="ui button tiny">Generate</button>
                    <button id="replace-input-btn" class="ui button tiny">Replace Input</button>
                    <button id="append-input-btn" class="ui button tiny">Append Input</button>
                </div>

                <pre id="stress-preview" class="stress-preview">No stress case generated yet.</pre>
            </div>
        </section>
    </div>

    <input id="open-file-input" type="file" class="hidden-input">

    <div id="appearance-panel" class="appearance-panel hidden-panel">
        <div class="appearance-card">
            <div class="panel-header">
                <div class="panel-title">Appearance</div>
                <button id="close-appearance-btn" class="ui button mini">Close</button>
            </div>
            <div class="appearance-grid">
                <label class="field">
                    <span>Theme</span>
                    <select id="theme-select">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                    </select>
                </label>

                <label class="field">
                    <span>Accent Color</span>
                    <input id="accent-color" type="color" value="#f59e0b">
                </label>

                <label class="field">
                    <span>Editor Font Size</span>
                    <input id="font-size" type="range" min="12" max="22" value="14">
                    <small id="font-size-value">14px</small>
                </label>

                <label class="field">
                    <span>Editor Font</span>
                    <select id="font-family">
                        <option value="JetBrains Mono">JetBrains Mono</option>
                        <option value="Consolas">Consolas</option>
                        <option value="Fira Code">Fira Code</option>
                        <option value="Courier New">Courier New</option>
                    </select>
                </label>
            </div>
        </div>
    </div>

    <div id="judge0-site-modal" class="ui modal">
        <div class="header">
            <span id="title"></span>
        </div>
        <div class="scrolling content"></div>
        <div class="actions">
            <div class="ui labeled icon cancel secondary button">
                <i class="close icon"></i>
                Close
            </div>
        </div>
    </div>
</body>
</html>
